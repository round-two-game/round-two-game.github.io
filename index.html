<style>
:root{
  color-scheme:dark;
  --wall:#121212;--paper:#1C1C1E;--soft:#2A2A2D;--line:#34343A;--note:#242427;
  --text:#EDEDED;--mut:#9A9AA0;--ptext:#EDEDED;--pmut:#9A9AA0;

  --ease:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.56,.64,1);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--wall);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:18px;line-height:1;color:var(--text)}
.brand svg{width:26px;height:26px;display:block}
.logo{display:block;width:72px;height:72px;margin:18px auto 0}
.word{text-align:center;font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1;margin:10px 0 0;color:var(--text)}
.word span{display:inline-block}
h1{font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.1;margin:18px 0 4px}
h2{font-weight:700;font-size:18px;line-height:1.2;color:var(--ptext);margin:0 0 10px}
p{margin:0}.mut{color:var(--mut)}.c{text-align:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .35s var(--pop),background .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
button:active{transition-duration:.08s}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--ink-t);font-weight:700;font-size:16px}
.btn:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;color:var(--mut);padding:10px 6px;min-height:44px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
input[type=text],textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#121214;color:var(--text);font:inherit}
textarea{resize:none;min-height:70px}
input[type=text]::placeholder,textarea::placeholder{color:#6B6B72}
input[type=text]:focus,textarea:focus{outline:2px solid #8A8A92;outline-offset:1px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#121214}
.seg button{flex:1;min-height:44px;padding:10px 6px;background:transparent;border:0;border-right:1px solid var(--line);font-size:15px;font-weight:600;color:var(--text)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--ink-t)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;color:var(--text)}
.opt:active{transform:scale(.975)}
.av:active,.seg button:active,.cemo button:active,.acc>button:active{transform:scale(.95)}
.cfab:active{transform:scale(.9)}
.opt.on{border-color:var(--ink);background:var(--note);box-shadow:inset 0 0 0 1px var(--ink)}
.opt small{color:var(--mut)}
.emo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);font-size:20px;flex:none}
.ck{animation:pop .4s var(--pop) both;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--ink-t);font-size:14px;font-weight:800;flex:none}
.code{display:flex;justify-content:center;gap:8px;font-variant-numeric:tabular-nums;padding-top:6px}
.code b{display:grid;place-items:center;width:52px;height:62px;border-radius:10px;font:800 32px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);background:var(--soft);border:1px solid var(--line)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:10px}
.dot.off{background:transparent;border:2px solid var(--mut)}
.q{font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.2}
.q[style]{font-size:22px!important}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-weight:600;font-size:13px;line-height:1;color:var(--text);background:var(--soft);border:1px solid var(--line);padding:6px 11px;border-radius:99px}
.kind{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;line-height:1.1}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{padding:20px 8px;font-weight:700;font-size:17px;text-align:center;justify-content:center}
.bar{margin:10px 0}.bar .l{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bar .b{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar .b i{display:block;height:100%;background:#6E6E75;width:0;transition:width .8s ease}
.bar.top .b i{background:var(--ink)}.bar.top .l{font-weight:800}
.ring{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:4px 2px 10px;margin:0}
.ring .mid{grid-column:1/-1;text-align:center;font-weight:700;font-size:18px;line-height:1.2;color:var(--text)}
.ring .mid b{display:inline;font-size:18px;font-weight:800;margin-right:4px}
.av{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;background:var(--paper);border:1px solid var(--line);padding:6px 6px 2px;border-radius:12px;color:var(--text)}
.av .face{color:#fff;width:100%;height:auto;aspect-ratio:1/1;border:0;box-shadow:none;border-radius:8px;font-size:34px}
.av>span:not(.face){font-weight:600;font-size:14px;line-height:1.25;text-align:center;padding:6px 0 6px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{transition:transform .4s var(--pop),border-color .2s,background .2s}
.av.on{transform:scale(1.04);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--note)}
.face{display:inline-grid;place-items:center;overflow:hidden;background:var(--soft);border:0;border-radius:50%;font-weight:700;color:#fff;flex:none;vertical-align:middle;font-style:normal}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.f28{width:28px;height:28px;font-size:14px}
.f44{width:44px;height:44px;font-size:20px}
.f64{width:64px;height:64px;font-size:28px}
.f88{width:96px;height:96px;font-size:40px}
.av .face{border-radius:8px}
.who{display:inline-flex;align-items:center;gap:8px}
.pickimg{display:flex;gap:12px;align-items:center}
.pickimg .face{cursor:pointer;padding:0;color:var(--mut);border:1px dashed #6B6B72;background:transparent;width:64px;height:64px;font-size:28px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:5px;font-weight:600}
.card.c{padding-top:18px}
.kcard{padding-top:18px!important}
.kcard .sticker{white-space:nowrap;display:inline-flex;margin:0 auto 8px}
.card.c p.nm,.kcard p.nm{font-weight:800;font-size:34px!important;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.blk{position:relative;background:var(--note);border:1px solid var(--line);padding:18px 16px;border-radius:12px;color:var(--text)}
.blk p{font-weight:600;font-size:22px;line-height:1.3}
.blk p.mut{font-size:14px!important;font-weight:500!important;color:var(--mut)}
.sc{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.sc:last-child{border:0}
.err{border:1px solid #6B6B72;background:#26262A;border-radius:10px;padding:12px;font-size:14px;color:var(--text)}
.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;gap:8px;align-items:center;padding:5px 11px;border-radius:99px;font-size:14px;font-weight:600;background:var(--soft);border:1px solid var(--line)}.chip button{background:none;border:0;padding:0;color:var(--mut);cursor:pointer}
.drink{font-size:48px;line-height:1;animation:wig 1.6s ease-in-out infinite;display:block}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cf{position:absolute;top:-16px;width:8px;height:14px;border-radius:1px;animation:fall linear infinite}
#app.enter{animation:rise .45s var(--ease) both}
#app.enter .code b{animation:pop .5s var(--pop) both}
#app.enter .code b:nth-child(2){animation-delay:.06s}#app.enter .code b:nth-child(3){animation-delay:.12s}#app.enter .code b:nth-child(4){animation-delay:.18s}
body.inroom #app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
#chat>*{pointer-events:auto}
.cfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--ink);color:var(--ink-t);font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.cfab[hidden],.cpanel[hidden],.badge[hidden]{display:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#E5E5EA;border:2px solid var(--wall);color:#121212;font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center}
.cpanel:not([hidden]){animation:sheet .5s var(--ease) both}
.cfab:not([hidden]){animation:pop .4s var(--pop) both}
.msg{animation:inpart .3s var(--ease) both}
.cpanel{-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;height:min(62vh,480px);display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:12px 14px calc(12px + env(safe-area-inset-bottom));color:var(--text)}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:18px;font-weight:700}
.clist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.msg b{font-size:12px;color:var(--mut)}
.msg p{background:var(--soft);padding:7px 11px;border-radius:12px;font-size:15px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me p{background:var(--ink);color:var(--ink-t)}
.msg.me b{display:none}
.cemo{display:flex;gap:8px;justify-content:center;padding:8px 0}
.cemo button{font-size:24px;background:var(--soft);border:0;border-radius:10px;padding:6px 12px}
.cform{display:flex;gap:8px}.cform .btn{width:auto;padding:0 18px;font-size:15px}
.fly{position:fixed;bottom:90px;font-size:36px;pointer-events:none;z-index:50;animation:fly 2.4s ease-out forwards}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0 0}
.qr{width:min(210px,60vw);height:auto;display:block;border-radius:8px;border:6px solid #fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes flip{0%{opacity:0;transform:translateY(40px) scale(.9);filter:blur(10px)}55%{opacity:1;filter:blur(0)}100%{transform:none}}
@keyframes inpart{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes vt-out{to{opacity:0;transform:translateX(-22%) scale(.96)}}
@keyframes vt-in{from{opacity:0;transform:translateX(30%)}}
@keyframes vt-out-b{to{opacity:0;transform:translateX(30%)}}
@keyframes vt-in-b{from{opacity:0;transform:translateX(-22%) scale(.96)}}
/* Seitenwechsel: Inhalt schiebt sich, Kopf und Leiste bleiben stehen */
#app{view-transition-name:page}
::view-transition-old(page){animation:vt-out .42s var(--ease) both}
::view-transition-new(page){animation:vt-in .42s var(--ease) both}
html[data-nav=back]::view-transition-old(page){animation-name:vt-out-b}
html[data-nav=back]::view-transition-new(page){animation-name:vt-in-b}
::view-transition-old(root),::view-transition-new(root){animation:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* feste Leiste unten (Start, Weiter) */
.dock{position:sticky;bottom:0;z-index:10;margin-top:auto;padding:22px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,rgba(18,18,18,.86) 40%);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22px);mask-image:linear-gradient(to bottom,transparent,#000 22px);display:flex;flex-direction:column;gap:8px}
.dock p{text-align:center;font-size:14px;color:var(--mut)}
body.hasdock #app{padding-bottom:0}
body.hasdock .cfab{bottom:calc(92px + env(safe-area-inset-bottom))}
body.hasdock #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
/* einklappbare Bereiche */
.acc{padding:0;overflow:hidden}
.acc>button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;background:none;border:0;text-align:left;color:var(--text)}
.acc>button b{font-size:16px;font-weight:700}
.acc>button small{display:block;color:var(--mut);font-size:13px;font-weight:400;margin-top:2px}
.acc>button i{font-style:normal;color:var(--mut);transition:transform .35s var(--ease)}
.acc.open>button i{transform:rotate(90deg)}
.acc .body{animation:reveal .35s var(--ease) both;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
/* Schritte beim Schreiben */
.steps{display:flex;gap:6px}
.steps div{flex:1;padding:8px 6px;border-radius:10px;background:var(--soft);color:var(--mut);font-size:13px;font-weight:600;text-align:center;border:1px solid transparent}
.steps div.now{background:var(--ink);color:var(--ink-t)}
.steps div.done{color:var(--ok);border-color:var(--line);background:transparent}
.av .got{position:absolute;top:4px;right:6px;font-style:normal;font-size:13px;background:var(--wall);border-radius:99px;padding:1px 5px;line-height:1.3}
.cnt{font-size:13px;color:var(--mut);text-align:right}
/* Karte */
.stage{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stage.flip{animation:flip .7s var(--ease) .12s both}
.stage.flip>*{animation:inpart .5s var(--ease) both}
.stage.flip>:nth-child(2){animation-delay:.3s}.stage.flip>:nth-child(3){animation-delay:.36s}.stage.flip>:nth-child(4){animation-delay:.42s}.stage.flip>:nth-child(n+5){animation-delay:.55s}.stage.flip>:first-child{animation-delay:.24s}
.stage .kind{margin-bottom:12px}
.stage .for{color:var(--mut);font-size:14px;margin-top:6px}
.stage .who2{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.stage hr{width:100%;border:0;border-top:1px solid var(--line);margin:14px 0 10px}
.stage .txt{font-size:24px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.vidwrap{display:flex;justify-content:center}
.vid{height:min(44vh,420px);aspect-ratio:9/16;max-width:100%;border:0;border-radius:14px;background:#000}
.stage .rule{color:var(--mut);font-size:14px;margin-top:10px}
/* Meldung */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
#toast div{background:#EDEDED;color:#121212;font-size:14px;font-weight:600;padding:10px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:toastin .45s var(--pop) both;backdrop-filter:blur(12px)}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-55vh) scale(1.4) rotate(14deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function relayJoin(code,onready){
  const cid=Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,6);
  const J={dead:false,socks:[],conn:null,onfail:null,
    close(){J.dead=true;clearTimeout(J.to);clearTimeout(J.to2);J.socks.forEach(s=>s&&s.close())}};

  relKey(code).then(k=>{
    if(J.dead)return;
    const T=k.topic;let left=BROKERS.length;
    BROKERS.forEach((url,i)=>{
      let pt=null;
      const s=mqOpen(url,{
        onopen(){s.sub(T+"/c/"+cid)},
        onsub(){
          const probe=()=>{if(J.conn||J.dead)return clearInterval(pt);relTx(k,s,T+"/h",{k:"p",c:cid})};
          J.reached=true;probe();pt=setInterval(probe,2000);

        },
        onmsg(tp,pl){relRx(k,s,pl,m=>{
          if(J.dead||!m)return;
          if(m.k==="a"){
            if(J.conn)return;
            clearInterval(pt);clearTimeout(J.to);clearTimeout(J.to2);
            J.socks.forEach(o=>{if(o&&o!==s)o.close()});

            if(m.k==="d")J.conn._emit("data",m.d);
            else if(m.k==="x"&&J.conn.open){J.conn.open=false;J.conn._emit("close")}
          }
        })},
        onclose(){
          clearInterval(pt);
          if(J.conn){if(s===J.s&&J.conn.open){J.conn.open=false;J.conn._emit("close")}}
          else if(--left<=0)giveUp();
        }});
      J.socks[i]=s;
    });

  }).catch(giveUp);

}

function canon(k,id){
  if(k==="tiktok")return "https://www.tiktokv.com/share/video/"+id+"/";
  if(k==="tiktokshort")return "https://vm.tiktok.com/"+id+"/";

/* Gibt eindeutige, bereinigte Links aus beliebigem Text zurück */

  const out=[],seen=new Set();

      const id=idf(m),u=canon(k,id);

      if(out.length>=(max||5000))return out;
    }
  }

}
function embedFor(v){

/* ZIP lesen (nur Text-Dateien), ohne Bibliothek */
async function unzipTexts(buf){
  const dv=new DataView(buf),u=new Uint8Array(buf);
  let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

  for(let k=0;k<n&&k<8000;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const meth=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),usz=dv.getUint32(off+24,true),nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lo=dv.getUint32(off+42,true);

    if(!/\.(json|txt|html?|csv)$/i.test(name)||usz>120e6)continue;

    out.push({name,text});

}
/* Nur Links aus "Likes"-Bereichen nehmen, nie aus Verlauf, Suche oder Kommentaren */
function likesFromText(name,text){
  const likeName=/like|liked|favorit|gef[aä]llt/i.test(name);
  let res=[];
  try{
    const j=JSON.parse(text);
    const walk=(o,inL)=>{
      if(typeof o==="string"){if(inL)res.push(...parseLinks(o));return}
      if(!o||typeof o!=="object")return;
      for(const key of Object.keys(o))walk(o[key],inL||/like|favorit|favourite|gef[aä]llt/i.test(key));
    };
    walk(j,likeName);
    return res;
  }catch(e){}
  if(likeName)return parseLinks(text);
  const a=text.search(/Like List|Favorite Videos|Likes and Favorites|Gef[aä]llt mir/i);
  if(a<0)return [];
  const rest=text.slice(a),b=rest.slice(20).search(/\n(?:Video Browsing History|Watch History|Comments?|Search|Direct Message|Post|Share History|Profile)\b/i);
  return parseLinks(b<0?rest:rest.slice(0,b+20));
}
async function importLikes(file){
  const buf=await file.arrayBuffer();
  const head=new Uint8Array(buf.slice(0,2));
  let found=[];
  if(head[0]===0x50&&head[1]===0x4B){
    for(const f of await unzipTexts(buf))found.push(...likesFromText(f.name,f.text));
  } else found=likesFromText(file.name,td.decode(buf));
  const seen=new Set(),uniq=[];
  for(const v of found)if(!seen.has(v.u)){seen.add(v.u);uniq.push(v)}

}

        Object.keys(H.subs).forEach(id=>{H.done[id]={};for(const k in H.subs[id])H.done[id][k]=true});
        H.items=shuffle(H.items);delete H.subs;
      }
      chat=H.chat.slice();
      S.players.forEach(x=>{if(x.id!==S.hostPid){x.online=false;x.off=Date.now()}else x.online=true});
    } else {
      S={code,hostPid:pid,phase:"lobby",players:[{id:pid,name,online:true}],mode:"gossip",cats:Object.keys(CATS),rounds:10,passes:1,pass:0,gen:0,nsub:0,round:null,card:null,answered:[],reveal:null};

        if(opened)return keepAlive(p);
        try{p.destroy()}catch(x){}

        if(n<(more?1:RETRY_MS.length)){if(!inited){status=`Verbinde mit dem Vermittlungsserver … (Versuch ${n+2+si})`;render()}clearTimeout(retryT);retryT=setTimeout(()=>startPeer(n+1,si),RETRY_MS[n])}

      if(host&&S.phase==="end"){clearTimeout(H.timer);S.phase="lobby";S.round=null;S.card=null;S.reveal=null;S.answered=[];H.vids=[];H.vdone={};H.vowner=null;S.players=S.players.filter(x=>x.online);bc()}break;
  }
}
function startGame(){
  const on=S.players.filter(p=>p.online);
  if(on.length<3||(!S.cats.length&&S.mode!=="wholiked"))return;
  S.players=on;
  if(S.mode==="gossip"){S.pass=0;return startWrite()}
  if(S.mode==="wholiked")return startCollect();
  H.bag=[];
  if(S.mode==="tod"){H.pool=Array(S.rounds).fill(0);H.idx=-1;S.total=S.rounds;return nextRound()}
  const pool=[];
  S.cats.forEach(k=>{
    if(S.mode==="never")NIE[k].forEach(q=>pool.push({cat:k,text:q}));
    else CATS[k].q.forEach(q=>pool.push({cat:k,text:q}));
  });
  H.pool=shuffle(pool).slice(0,S.rounds);H.idx=-1;S.total=H.pool.length;
  nextRound();
}
/* Who Liked: erst Links sammeln, dann Video für Video raten */
function startCollect(){
  S.gen++;H.vids=[];H.vdone={};H.pending=false;S.answered=[];S.nsub=0;S.round=null;S.phase="vcollect";bc();
}
function checkVids(){
  if(S.phase!=="vcollect"||H.pending)return;
  const req=required();
  if(req.length&&req.every(id=>H.vdone[id])){
    H.pending=true;
    setTimeout(()=>{H.pending=false;if(S.phase==="vcollect")startVideos()},1200);
  }
}
function startVideos(){
  const vs=H.vids.filter(v=>S.players.some(x=>x.id===v.owner));
  if(!vs.length)return;
  H.pool=shuffle(vs).slice(0,S.rounds);H.idx=-1;S.total=H.pool.length;H.vowner=null;
  nextRound();
}
/* Gossip Wheel: alle schreiben, dann werden die Karten nacheinander aufgedeckt */
function startWrite(){
  S.gen++;H.done={};H.items=[];H.pending=false;S.answered=[];S.nsub=0;S.card=null;S.phase="write";bc();
}
function checkSubs(){
  if(S.phase!=="write"||H.pending)return;
  const req=required();
  if(req.length&&req.every(id=>S.answered.includes(id))){
    H.pending=true;
    setTimeout(()=>{H.pending=false;if(S.phase==="write")startCards()},1200);
  }
}
function startCards(){
  const cs=H.items.filter(it=>S.players.some(x=>x.id===it.target));
  if(!cs.length)return;
  H.cards=shuffle(cs);H.ci=-1;cardAdvance();
}
function cardAdvance(){
  H.ci++;
  if(H.ci>=H.cards.length){
    S.pass++;
    if(S.pass<S.passes)return startWrite();
    S.phase="end";S.card=null;S.answered=[];return bc();
  }
  const c=H.cards[H.ci];
  S.phase="card";
  S.card={i:H.ci,n:H.cards.length,pass:S.pass,target:c.target,kind:c.kind,text:c.text};
  S.answered=[];bc();
}
/* Wer am ehesten */
function nextRound(){
  H.idx++;H.answers={};H.pending=false;S.answered=[];S.reveal=null;
  if(H.idx>=H.pool.length){S.phase="end";S.round=null;return bc()}
  if(S.mode==="tod"){
    const ok=id=>S.players.some(x=>x.id===id&&x.online);
    H.bag=(H.bag||[]).filter(ok);
    if(!H.bag.length)H.bag=shuffle(S.players.filter(p=>p.online).map(p=>p.id));
    const tid=H.bag.pop()||S.hostPid;
    S.round={idx:H.idx,type:"tod",target:tid,cat:null,kind:null,text:null};S.phase="choose";return bc();
  }
  const it=H.pool[H.idx];
  if(S.mode==="wholiked"){
    H.vowner=it.owner;H.answers={[it.owner]:"own"};S.answered=[it.owner];
    S.round={idx:H.idx,type:"liked",cat:null,text:"",url:it.u,kind:it.k,embed:embedFor(it)};S.phase="answer";
    if(it.owner===pid)ownIdx=H.idx;else if(conns[it.owner])try{conns[it.owner].send({t:"own",idx:H.idx})}catch(e){}
    return bc();
  }
  S.round={idx:H.idx,type:S.mode==="never"?"never":"likely",cat:it.cat,text:it.text};S.phase="answer";bc();
}
function doReveal(){
  const ans=H.answers,counts={};
  if(S.round.type==="never"){
    const yes=Object.keys(ans).filter(id=>ans[id]==="ja"&&S.players.some(x=>x.id===id));
    const no=Object.keys(ans).filter(id=>ans[id]==="nein"&&S.players.some(x=>x.id===id));
    S.reveal={yes,no};S.phase="reveal";return bc();
  }
  if(S.round.type==="liked"){
    const owner=H.vowner,guess=Object.keys(ans).filter(id=>id!==owner&&S.players.some(x=>x.id===id));
    guess.forEach(id=>{counts[ans[id]]=(counts[ans[id]]||0)+1});
    const right=guess.filter(id=>ans[id]===owner),wrong=guess.filter(id=>ans[id]!==owner);
    S.reveal={owner,counts,right,wrong};S.phase="reveal";return bc();
  }
  Object.values(ans).forEach(v=>{if(S.players.some(x=>x.id===v))counts[v]=(counts[v]||0)+1});
  const max=Math.max(0,...Object.values(counts));
  const winners=max?Object.keys(counts).filter(k=>counts[k]===max):[];
  S.reveal={counts,winners};S.phase="reveal";bc();
}

/* ---------- Client ---------- */
function clientData(d,g,si){
  if(!d||jg!==g)return;
  lastRx=Date.now();
  if(d.t==="hb")return;
  if(d.t==="chat"){chatIn(d.m);return}
  if(d.t==="chats"){(d.m||[]).forEach(m=>chatIn(m,true));return}
  if(d.t==="own"){ownIdx=+d.idx;render(true);return}
  if(d.t==="avs"){for(const k in d.m){const a=cleanAv(d.m[k]);if(a)AV[k]=a}render();return}
  if(d.t==="s"){g.got=true;if(si!=null)srvI=si;clearTimeout(g.timer);S=d.s;status="";lost=false;render()}
  else if(d.t==="err"){clearTimeout(g.timer);fail(d.m)}
}
function joinRoom(code,name,keep,n,si){
  const fresh=n===undefined;
  n=n||0;if(si==null)si=keep?srvI:0;
  role="client";err="";room={code,name};
  if(!keep){S=null;chat=[];unread=0;chatOpen=false;status="Verbinde …"+(n||si?` (Versuch ${n+1+si})`:"");lost=false;render()}
  ss.set("ex_room",JSON.stringify({code,name}));
  clearTimeout(retryT);
  try{peer&&peer.destroy()}catch(e){}
  getWake();
  /* Beide Wege werden gleichzeitig versucht. Der erste, der den Host erreicht, wird benutzt. */
  if(fresh||!jg){
    if(jg)jg.stop();
    const G={chosen:null,got:false,peerDead:null,relayDead:!relayOK,relay:null,timer:null,stopPeer:null,
      stop(){clearTimeout(G.timer);clearTimeout(G.rt);if(G.relay)G.relay.close();if(G.stopPeer)G.stopPeer()}};
    jg=G;conn=null;
    if(relayOK){
      const J=relayJoin(code,c=>{const take=()=>{
        if(jg!==G||G.chosen||role!=="client"){c.close();return}
        G.chosen="relay";if(G.stopPeer)G.stopPeer();
        conn=c;
        c.on("data",d=>clientData(d,G,null));
        c.on("close",()=>{if(role==="client"&&conn===c&&jg===G)rejoinSoon(1500)});
        c.send({t:"hello",pid,name,av:myAv});
        clearTimeout(G.timer);G.timer=setTimeout(()=>{if(jg!==G||G.got)return;if(S)rejoinSoon(1000);else fail("Raum nicht erreichbar. Code prüfen und erneut versuchen.")},12000);
      };
      /* Die direkte Verbindung bekommt einen kurzen Vorsprung, sonst sofort der Ersatzweg */
      G.ready=take;if(G.peerDead)take();else G.rt=setTimeout(take,2500)});
      J.onfail=()=>{G.relayDead=true;G.noRoom=!!J.reached;if(jg!==G||role!=="client"||!G.peerDead)return;if(S)rejoinSoon(3000);else fail(G.noRoom?"Raum nicht gefunden. Code prüfen.":G.peerDead)};
      G.relay=J;
    }
  }
  const g=jg;
  if(g.chosen==="relay")return;
  const p=new Peer(SERVERS[si]);peer=p;
  const more=si+1<SERVERS.length;
  let timer=null;
  g.stopPeer=()=>{clearTimeout(timer);clearTimeout(retryT);try{p.destroy()}catch(x){}if(peer===p)peer=null};
  /* PeerJS-Weg ist gescheitert: nur dann aufgeben, wenn auch der Ersatzweg nichts gefunden hat */
  const pfail=m=>{
    if(jg!==g||g.chosen==="relay")return;
    try{p.destroy()}catch(x){}
    g.peerDead=m;
    if(g.ready&&!g.chosen){clearTimeout(g.rt);g.ready();return}
    if(g.relayDead)fail(g.noRoom?"Raum nicht gefunden. Code prüfen.":m);else{status="Suche den Raum auf einem anderen Weg …";render()}
  };
  const nextSrv=()=>{try{p.destroy()}catch(x){}clearTimeout(retryT);retryT=setTimeout(()=>{if(role==="client"&&room&&jg===g)joinRoom(code,name,keep,0,si+1)},200)};
  const again=ms=>{if(peer!==p||jg!==g)return;rejoinSoon(ms)};
  timer=setTimeout(()=>{if(!g.got&&peer===p&&jg===g){if(S)again(1000);else if(more)nextSrv();else pfail("Raum nicht erreichbar. Code prüfen und erneut versuchen.")}},15000);
  p.on("open",()=>{
    const c=p.connect("roundtwo-"+code,{reliable:true});
    c.on("open",()=>{
      if(jg!==g||(g.chosen&&g.chosen!=="peer")){try{c.close()}catch(e){}return}
      g.chosen="peer";if(g.relay)g.relay.close();
      conn=c;c.send({t:"hello",pid,name,av:myAv});
    });
    c.on("data",d=>clientData(d,g,si));
    c.on("close",()=>{if(role==="client"&&conn===c)again(1500)});
  });
  p.on("error",e=>{
    clearTimeout(timer);if(peer!==p||jg!==g)return;
    if(g.got&&SOFT.has(e.type)&&conn&&conn.open)return;   /* direkte Verbindung zum Host steht, der Vermittlungsserver wird nur zum Beitreten gebraucht */
    if(S&&e.type!=="unavailable-id"){if(!g.relayDead&&!g.chosen){try{p.destroy()}catch(x){}g.peerDead="x";if(g.ready){clearTimeout(g.rt);g.ready()}return}again(3000)}
    else if(!S&&more&&(e.type==="peer-unavailable"||(SOFT.has(e.type)&&n>=1)))nextSrv();
    else if(SOFT.has(e.type)&&n<RETRY_MS.length){
      try{p.destroy()}catch(x){}
      if(g.relayDead){status=`Verbinde mit dem Vermittlungsserver … (Versuch ${n+2+si})`;render()}
      clearTimeout(retryT);retryT=setTimeout(()=>{if(role==="client"&&room&&jg===g)joinRoom(code,name,keep,n+1,si)},RETRY_MS[n]);
    }
    else pfail(e.type==="peer-unavailable"?"Raum nicht gefunden. Code prüfen.":netMsg(e));
  });
}
function send(m){
  if(role==="host")act(pid,m);
  else if(conn&&conn.open)conn.send(m);
}

function beep(kind){
  if(!snd||!actx||actx.state!=="running")return;
  const t0=actx.currentTime,seq=kind==="card"?[[523,0],[784,.1]]:[[880,0]];
  seq.forEach(([f,d])=>{
    const o=actx.createOscillator(),g=actx.createGain();

    g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(.14,t0+d+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.2);
    o.connect(g);g.connect(actx.destination);o.start(t0+d);o.stop(t0+d+.22);
  });
}

  unlock();
  const a=b.dataset.ch;
  if(a==="toggle"){chatOpen=!chatOpen;if(chatOpen)unread=0;chatShow();if(chatOpen){const i=document.getElementById("ct");if(i)i.focus()}}
  else if(a==="emo")sendChat(b.dataset.v);
  else if(a==="send"){const i=document.getElementById("ct");sendChat(i.value);i.value=""}
});
document.getElementById("chat").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="ct"){sendChat(e.target.value);e.target.value=""}
});

/* ---------- Aktionen ---------- */
const A = {
  diag(){runDiag()},
  diagback(){diag=null;render(true)},
  async diagcopy(){const x=diagText();try{await navigator.clipboard.writeText(x);toast("Kopiert. Jetzt im Chat einfügen.")}catch(e){prompt("Text kopieren:",x)}},
  install(){const d=deferredInstall;if(!d)return;deferredInstall=null;d.prompt();render(true)},
  pickimg(){const i=document.getElementById("fi");if(i)i.click()},
  rmimg(){keepName();myAv="";ls.set("ex_av","");render(true)},
  create(){const n=document.getElementById("nm").value.trim();if(!n)return;myName=n;ls.set("ex_name",n);hostRoom(n)},
  join(){const n=document.getElementById("nm").value.trim(),c=document.getElementById("cd").value.trim().toUpperCase();
    if(!n){err="Bitte Namen eingeben.";return render()}
    if(c.length!==4){err="Der Code hat 4 Buchstaben.";return render()}
    myName=n;ls.set("ex_name",n);joinRoom(c,n)},
  snd(){snd=!snd;ls.set("ex_snd",snd?"1":"0");unlock();render(true)},
  leave(){if(S&&role==="host"&&!confirm("Raum schließen? Das beendet das Spiel für alle."))return;if(role==="client"&&conn&&conn.open)try{conn.send({t:"bye"})}catch(e){}cleanup();err="";render()},
  reconnect(){if(room)joinRoom(room.code,room.name,true)},
  mode(d){send({t:"set",mode:d.v,cats:S.cats,rounds:S.rounds})},
  tod(d){send({t:"tod",v:d.v})},
  rounds(d){send({t:"set",mode:S.mode,cats:S.cats,rounds:+d.v})},
  cat(d){const c=S.cats.includes(d.v)?S.cats.filter(k=>k!==d.v):[...S.cats,d.v];send({t:"set",mode:S.mode,cats:c,rounds:S.rounds})},
  allcats(){send({t:"set",mode:S.mode,cats:Object.keys(CATS),rounds:S.rounds})},
  nocats(){send({t:"set",mode:S.mode,cats:[],rounds:S.rounds})},
  passes(d){send({t:"set",mode:S.mode,cats:S.cats,rounds:S.rounds,passes:+d.v})},
  ban(){const i=document.getElementById("bw");if(!i)return;const w=i.value.trim();if(!w)return;send({t:"ban",op:"add",w});},
  unban(d){send({t:"ban",op:"del",w:d.v})},
  start(){send({t:"start"})},
  acc(d){openSec[d.v]=!openSec[d.v];render(true)},
  vdel(d){vstage.splice(+d.v,1);render(true)},
  vadd(){
    const x=document.getElementById("vt");if(x)vtext=x.value;
    const found=parseLinks(vtext,50);
    if(!found.length){toast("Kein passender Link gefunden");return}
    let add=0;for(const v of found){if(vstage.length>=5)break;if(!vstage.some(s=>s.u===v.u)){vstage.push(v);add++}}
    vtext="";likeMsg="";toast(add?add+(add===1?" Link hinzugefügt":" Links hinzugefügt"):"Schon vorhanden");render(true)},
  vpick(){vstage=shuffle(savedLikes()).slice(0,5);likeMsg="";render(true)},
  vimp(){const i=document.getElementById("lk");if(i)i.click()},
  vsend(){if(!vstage.length)return;send({t:"vsub",links:vstage});vsent=true;render(true)},
  pick(d){draft.target=d.v;render(true);const f=document.getElementById("wform");if(f){f.scrollIntoView({block:"center",behavior:"smooth"});const x=document.getElementById("ft");if(x)x.focus({preventScroll:true})}},
  fill(){
    const K=KINDS[draft.stage],nm=draft.target?pname(draft.target):"";
    const k2=pick(S.cats);
    const tx=K.k==="challenge"?pick(CHAL[k2]):K.k==="question"?pick(QS[k2]):pick(RUM[k2]).split("{n}").join(nm);
    draft.text=tx;render(true)},
  sendsub(){
    if(!draft.target||!draft.text.trim())return;
    send({t:"sub",kind:KINDS[draft.stage].k,target:draft.target,text:draft.text});
    toast(KINDS[draft.stage].n+" für "+pname(draft.target)+" gesendet");
    draft.sent.push({stage:draft.stage,id:draft.target});
    draft.stage++;draft.target=null;draft.text="";render(true)},
  go(){send({t:"go"})},
  gnext(){send({t:"gnext"})},
  ans(d){mine=d.v;send({t:"ans",v:d.v});if(role==="client")render()},
  reveal(){send({t:"reveal"})},
  next(){send({t:"next"})},
  again(){send({t:"again"})},
  async share(){
    const url=location.origin+location.pathname+"?r="+S.code,text="Komm zu Round Two: "+S.code;
    try{if(navigator.share){await navigator.share({title:"Round Two",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(url);toast("Link kopiert")}catch(e){prompt("Link kopieren:",url)}
  }
};
$app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
function keepName(){const n=document.getElementById("nm");if(n)myName=n.value}
$app.addEventListener("change",async e=>{
  if(e.target.id==="lk"&&e.target.files[0]){
    const f=e.target.files[0];e.target.value="";
    try{
      const x=document.getElementById("vt");if(x)vtext=x.value;
      const got=await importLikes(f);
      if(!got.length)likeMsg="In dieser Datei wurden keine Likes gefunden. Nimm die Datei aus dem Daten-Download (TikTok: user_data, Instagram: liked_posts).";
      else{ls.set("ex_likes",JSON.stringify(got));vstage=got.slice(0,5);likeMsg=got.length+" Likes gefunden und gespeichert. 5 davon sind ausgewählt.";toast(got.length+" Likes importiert")}
    }catch(err2){likeMsg="Die Datei konnte nicht gelesen werden. Entpacke die ZIP-Datei oder wähle die JSON-Datei darin."}
    render(true);return;
  }
  if(e.target.id!=="fi"||!e.target.files[0])return;
  keepName();
  try{myAv=await readImg(e.target.files[0]);ls.set("ex_av",myAv)}catch(x){err="Das Bild konnte nicht gelesen werden.";}
  render(true);
});
$app.addEventListener("input",e=>{
  if(e.target.id==="vt"){vtext=e.target.value;return}
  if(e.target.id!=="ft")return;
  draft.text=e.target.value;
  const b=document.getElementById("sb");if(b)b.disabled=!draft.text.trim();
  const c=document.getElementById("cnt");if(c)c.textContent=draft.text.length+" / 140";
});
$app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cd")A.join();if(e.key==="Enter"&&e.target.id==="bw")A.ban()});

render();
/* Heartbeat: Host meldet sich alle 5 s, Clients melden sich alle 4 s. Tote Verbindungen werden erkannt. */
setInterval(()=>{
  if(role==="host"&&S){
    const now=Date.now();
    for(const id in conns){
      const c=conns[id];
      if(now-(c._rx||0)>16000){try{c.close()}catch(e){}drop(c)}
      else try{c.send({t:"hb"})}catch(e){}
    }
    if(relay&&relay.gc)relay.gc();
    if(S.phase==="lobby"){
      const n=S.players.length;
      S.players=S.players.filter(p=>p.online||p.id===S.hostPid||now-(p.off||now)<60000);
      if(S.players.length!==n)bc();
    }
  } else if(role==="client"&&room){
    if(conn&&conn.open)try{conn.send({t:"ping"})}catch(e){}
    if(S&&!lost&&Date.now()-lastRx>14000){lost=true;render();joinRoom(room.code,room.name,true)}
  }
},4000);
/* Zurück aus dem Hintergrund: sofort neu verbinden bzw. Zustand neu senden */
function resume(){
  if(document.visibilityState&&document.visibilityState!=="visible")return;
  getWake();
  if(role==="host"){try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){}if(S)bc()}
  else if(role==="client"&&room&&(lost||!conn||!conn.open||Date.now()-lastRx>6000)){
    if(S){lost=true;render()}
    joinRoom(room.code,room.name,true);
  }
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveHost();else resume()});
window.addEventListener("pagehide",saveHost);
window.addEventListener("pageshow",e=>{if(e.persisted)resume()});
window.addEventListener("online",resume);
(function(){
  const r=JSON.parse(ss.get("ex_room")||"null");
  if(r&&r.code&&r.name){joinRoom(r.code,r.name);return}
  if(new URLSearchParams(location.search).get("r"))return;
  let h=null;try{h=JSON.parse(localStorage.getItem("ex_host")||"null")}catch(e){}
  if(h&&h.S&&h.H&&Date.now()-h.ts<30*60*1000){pid=h.S.hostPid;ss.set("ex_pid",pid);hostRoom(null,h)}
})();
